name: caminhadas
description: "Aplicativo de caminhadas desenvolvido para a Aula 05 do SENAI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  provider: ^6.0.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  path_provider_foundation: 2.5.1
